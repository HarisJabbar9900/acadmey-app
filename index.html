<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al-Zia Science Academy Portal</title>
  </head>
  <body style="background-color: #020617; color: #ffffff; margin: 0; font-family: system-ui, -apple-system, sans-serif;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; items-center; justify-content: center; align-items: center; background-color: #020617; color: #ffffff; text-align: center; padding: 1rem;">
        <div style="width: 56px; height: 56px; margin-bottom: 1.25rem; border: 4px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <h2 style="font-size: 1.25rem; font-weight: 800; color: #ffffff; margin: 0 0 0.5rem 0; letter-spacing: -0.025em;">Al-Zia Science Academy</h2>
        <p style="font-size: 0.875rem; color: #94a3b8; margin: 0;">Loading Portal & Student Records...</p>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
