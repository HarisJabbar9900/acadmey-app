<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al-Zia Science Academy Portal</title>
    
    <!-- Google Fonts: Plus Jakarta Sans (Headings), Inter (Body), JetBrains Mono (Numbers/Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Preconnect to Firebase for instant 10x network speed -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

    <!-- Instant Zero-Latency Mobile Splash Style (Hidden on Desktop/Laptop) -->
    <style>
      @media (max-width: 767px) {
        #mobile-instant-splash {
          position: fixed;
          inset: 0;
          z-index: 99999999;
          background: #050814;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          color: white;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          user-select: none;
        }
      }
      @media (min-width: 768px) {
        #mobile-instant-splash {
          display: none !important;
        }
      }
      @keyframes splashBarGlow {
        0% { left: 0%; width: 25%; }
        50% { left: 45%; width: 45%; }
        100% { left: 75%; width: 25%; }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-white min-h-screen">
    <!-- Instant Mobile Splash for 0ms First Paint (Never shown on Laptop) -->
    <div id="mobile-instant-splash">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px;">
        <div style="width: 86px; height: 86px; border-radius: 24px; background: linear-gradient(135deg, #0f172a, #1e1b4b); border: 2px solid #f59e0b; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 0 30px rgba(99, 102, 241, 0.35); margin-bottom: 20px;">
          🎓
        </div>
        <h1 style="font-size: 22px; font-weight: 900; color: #fbbf24; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 6px 0;">
          Al-Zia Science Academy
        </h1>
        <p style="font-size: 11px; color: #94a3b8; font-weight: 500; margin: 0 0 28px 0; letter-spacing: 0.5px;">
          Center for Science & Academic Excellence
        </p>
        <div style="width: 160px; height: 4px; background: #0f172a; border-radius: 99px; overflow: hidden; position: relative; border: 1px solid #1e293b;">
          <div style="position: absolute; top: 0; left: 0; height: 100%; background: linear-gradient(90deg, #6366f1, #f59e0b); border-radius: 99px; animation: splashBarGlow 1.2s infinite alternate ease-in-out;"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
