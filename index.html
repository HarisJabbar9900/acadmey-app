<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al-Zia Science Academy Portal</title>
  </head>
  <body style="background-color: #0f172a; color: #ffffff; margin: 0; font-family: system-ui, -apple-system, sans-serif;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #0f172a; color: #ffffff; text-align: center; padding: 1rem;">
        <div style="width: 50px; height: 50px; margin-bottom: 1rem; border: 4px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <h2 style="font-size: 1.25rem; font-weight: 800; color: #f59e0b; margin: 0 0 0.5rem 0;">Al-Zia Science Academy</h2>
        <p style="font-size: 0.875rem; color: #94a3b8; margin: 0;">Loading Student & Academy Portal...</p>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
