<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Luxury Midnight & Indigo -->
    <linearGradient id="azBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Luxury 24K Gold Gradient for Emblem -->
    <linearGradient id="azGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Science Electric Cyan Gradient for Atom Orbit & Zia Ray -->
    <linearGradient id="azCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="azBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Center Light (Zia / Radiance) -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle with Luxury Bevel -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#azBg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#centerGlow)" />
  
  <!-- Outer Subtle Highlight Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#azBorder)" stroke-width="7" stroke-opacity="0.85" />
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.1" />

  <!-- Science Orbit Rings (Symbolizing Science & Physics) -->
  <g filter="url(#shadow)" opacity="0.65">
    <ellipse cx="256" cy="256" rx="200" ry="76" fill="none" stroke="url(#azCyan)" stroke-width="4.5" stroke-dasharray="14 10" transform="rotate(-30 256 256)" opacity="0.6" />
    <ellipse cx="256" cy="256" rx="200" ry="76" fill="none" stroke="url(#azCyan)" stroke-width="4.5" stroke-dasharray="14 10" transform="rotate(30 256 256)" opacity="0.6" />
    <!-- Orbit Nucleus / Electrons -->
    <circle cx="95" cy="165" r="7" fill="#67E8F9" filter="url(#goldGlow)" />
    <circle cx="415" cy="345" r="7" fill="#67E8F9" filter="url(#goldGlow)" />
  </g>

  <!-- Core Monogram "AZ" (Al-Zia) -->
  <g filter="url(#shadow)">
    <!-- Letter 'A' (Bold Architectural Pillar of Knowledge) -->
    <path d="M 195 130 
             L 115 365 
             L 165 365 
             L 185 305 
             L 255 305 
             L 245 265 
             L 198 265 
             L 218 200 
             Z" 
          fill="url(#azGold)" />

    <!-- Letter 'Z' (Interlinked Dynamic Modern Science Slash) -->
    <path d="M 230 148 
             L 395 148 
             L 395 188 
             L 290 325 
             L 400 325 
             L 400 365 
             L 220 365 
             L 220 325 
             L 330 188 
             L 230 188 
             Z" 
          fill="url(#azGold)" />
          
    <!-- Connecting Golden Ribbon Accent -->
    <polygon points="198,265 245,265 265,305 185,305" fill="url(#azGold)" opacity="0.9" />
  </g>

  <!-- Radiant 8-Point Star of Knowledge (Zia = 'الضیاء' / Divine Light of Learning) -->
  <g transform="translate(256, 102)" filter="url(#goldGlow)">
    <!-- Vertical and horizontal rays -->
    <path d="M 0 -36 L 6 -8 L 34 0 L 6 8 L 0 36 L -6 8 L -34 0 L -6 -8 Z" fill="url(#azGold)" />
    <!-- Diagonal rays -->
    <path d="M 0 -22 L 4 -5 L 21 0 L 4 5 L 0 22 L -4 5 L -21 0 L -4 -5 Z" fill="#FFFBEB" transform="rotate(45)" opacity="0.9" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Graduation Cap Silhouette (Academic Excellence) -->
  <g transform="translate(195, 108) scale(0.65)" opacity="0.95" filter="url(#shadow)">
    <polygon points="0,0 45,-18 90,0 45,18" fill="#FDE047" />
    <path d="M 18,7 L 18,24 C 18,34 72,34 72,24 L 72,7 Z" fill="#D97706" />
    <path d="M 76,2 L 88,15 L 86,30" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Subtitle Ribbon Text: "AL-ZIA" at bottom -->
  <g transform="translate(256, 422)">
    <rect x="-110" y="-18" width="220" height="30" rx="15" fill="#0F172A" stroke="url(#azBorder)" stroke-width="2" />
    <text x="0" y="3" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" 
          font-weight="900" 
          letter-spacing="4.5" 
          fill="url(#azGold)" 
          text-anchor="middle">
      AL-ZIA
    </text>
  </g>
</svg>